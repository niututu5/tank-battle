<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战 - Tank Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', 'SimHei', monospace;
            overflow: hidden;
            user-select: none;
        }

        .game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 780px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #16213e, #0f3460);
            border: 3px solid #e94560;
            border-radius: 10px;
            color: #eee;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
        }

        .game-header .title {
            font-size: 24px;
            color: #e94560;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.6);
        }

        .game-header .info span {
            color: #f5c518;
            margin-left: 5px;
        }

        .lives {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .lives .tank-icon {
            width: 16px;
            height: 16px;
            background: #4ecca3;
            border-radius: 2px;
        }

        canvas {
            border: 4px solid #533483;
            border-radius: 5px;
            box-shadow: 0 0 40px rgba(83, 52, 131, 0.5), inset 0 0 60px rgba(0,0,0,0.3);
            background: #111;
        }

        .game-footer {
            width: 780px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #16213e, #0f3460);
            border: 2px solid #533483;
            border-radius: 8px;
            color: #aaa;
            font-size: 13px;
            text-align: center;
        }

        .game-footer kbd {
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 2px 8px;
            color: #e94560;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #e94560;
            border-radius: 15px;
            padding: 30px 50px;
            text-align: center;
            color: #eee;
            z-index: 10;
            display: none;
        }

        .overlay.show {
            display: block;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .overlay h2 {
            font-size: 32px;
            color: #e94560;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(233, 69, 96, 0.6);
        }

        .overlay p {
            font-size: 16px;
            margin: 8px 0;
            color: #ccc;
        }

        .overlay .score {
            font-size: 36px;
            color: #f5c518;
            font-weight: bold;
        }

        .btn {
            margin-top: 15px;
            padding: 12px 40px;
            font-size: 18px;
            font-family: 'Courier New', 'SimHei', monospace;
            font-weight: bold;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #ff6b81;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        @media (max-width: 800px) {
            canvas {
                width: 100%;
                height: auto;
            }
            .game-header, .game-footer {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="title">🎮 坦 克 大 战</div>
            <div class="info">
                得分: <span id="score">0</span>
            </div>
            <div class="info">
                关卡: <span id="level">1</span>
            </div>
            <div class="info">
                击杀: <span id="kills">0</span>
            </div>
            <div class="lives" id="lives">
                生命:
            </div>
        </div>

        <canvas id="gameCanvas" width="780" height="600"></canvas>

        <div class="game-footer">
            <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 移动 &nbsp;|&nbsp;
            <kbd>空格</kbd> 射击 &nbsp;|&nbsp;
            <kbd>P</kbd> 暂停 &nbsp;|&nbsp;
            <kbd>R</kbd> 重新开始
        </div>

        <!-- 游戏结束遮罩 -->
        <div class="overlay" id="gameOverOverlay">
            <h2 id="overlayTitle">💥 游戏结束</h2>
            <p>最终得分:</p>
            <div class="score" id="finalScore">0</div>
            <p id="overlayMsg"></p>
            <button class="btn" id="restartBtn">🔄 再来一局</button>
        </div>

        <!-- 过关遮罩 -->
        <div class="overlay" id="levelUpOverlay">
            <h2>🎉 恭喜过关！</h2>
            <p>关卡 <span id="levelUpNum" style="color:#e94560;font-weight:bold;">1</span> 完成</p>
            <p>得分:</p>
            <div class="score" id="levelUpScore">0</div>
            <button class="btn" id="nextLevelBtn">▶ 下一关</button>
        </div>
    </div>

    <script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // DOM elements
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const killsEl = document.getElementById('kills');
        const livesEl = document.getElementById('lives');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const levelUpOverlay = document.getElementById('levelUpOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const finalScore = document.getElementById('finalScore');
        const overlayMsg = document.getElementById('overlayMsg');
        const levelUpNum = document.getElementById('levelUpNum');
        const levelUpScore = document.getElementById('levelUpScore');

        // Game constants
        const TILE_SIZE = 30;
        const COLS = 26;  // 780 / 30
        const ROWS = 20;  // 600 / 30
        const PLAYER_SPEED = 3;
        const ENEMY_SPEED = 1.5;
        const BULLET_SPEED = 6;
        const MAX_ENEMIES = 6;
        const MAX_LIVES = 3;
        const ENEMY_SPAWN_INTERVAL = 3000; // ms
        const ENEMY_SHOOT_INTERVAL = 1500; // ms

        // Tile types
        const EMPTY = 0;
        const BRICK = 1;
        const STEEL = 2;
        const WATER = 3;
        const BASE = 4;

        // Direction
        const UP = 0;
        const RIGHT = 1;
        const DOWN = 2;
        const LEFT = 3;

        // Colors
        const COLORS = {
            [BRICK]: '#c97b3b',
            [STEEL]: '#888',
            [WATER]: '#2266cc',
            [BASE]: '#ffdd00',
        };

        // Game state
        let map = [];
        let player = null;
        let enemies = [];
        let bullets = [];
        let particles = [];
        let score = 0;
        let level = 1;
        let kills = 0;
        let lives = MAX_LIVES;
        let gameRunning = true;
        let gamePaused = false;
        let spawnTimer = 0;
        let enemyShootTimer = 0;
        let keys = {};
        let baseAlive = true;

        // ====================== Map Generation ======================

        function generateMap(lvl) {
            const m = [];
            for (let row = 0; row < ROWS; row++) {
                m[row] = new Array(COLS).fill(EMPTY);
            }

            // Border walls (steel)
            for (let col = 0; col < COLS; col++) {
                m[0][col] = STEEL;
                m[ROWS - 1][col] = STEEL;
            }
            for (let row = 0; row < ROWS; row++) {
                m[row][0] = STEEL;
                m[row][COLS - 1] = STEEL;
            }

            // Base (eagle) - bottom center
            const baseCol = Math.floor(COLS / 2);
            const baseRow = ROWS - 2;
            m[baseRow][baseCol] = BASE;
            // Walls around base
            m[baseRow][baseCol - 1] = BRICK;
            m[baseRow][baseCol + 1] = BRICK;
            m[baseRow - 1][baseCol - 1] = BRICK;
            m[baseRow - 1][baseCol] = BRICK;
            m[baseRow - 1][baseCol + 1] = BRICK;

            // Generate walls based on level
            const numBrickClusters = 5 + lvl * 3;
            const numSteelBlocks = 2 + lvl * 2;
            const numWaterTiles = Math.min(lvl * 2, 8);

            // Brick clusters
            for (let i = 0; i < numBrickClusters; i++) {
                const cr = randomInt(2, ROWS - 5);
                const cc = randomInt(2, COLS - 3);
                const shape = randomInt(0, 3);

                if (shape === 0) { // 2x2
                    if (canPlace(m, cr, cc, 2, 2)) fillRect(m, cr, cc, 2, 2, BRICK);
                } else if (shape === 1) { // horizontal 3
                    if (canPlace(m, cr, cc, 3, 1)) fillRect(m, cr, cc, 3, 1, BRICK);
                } else if (shape === 2) { // vertical 3
                    if (canPlace(m, cr, cc, 1, 3)) fillRect(m, cr, cc, 1, 3, BRICK);
                } else { // L-shape
                    if (canPlace(m, cr, cc, 2, 2)) {
                        m[cr][cc] = BRICK;
                        m[cr][cc + 1] = BRICK;
                        m[cr + 1][cc] = BRICK;
                    }
                }
            }

            // Steel blocks
            for (let i = 0; i < numSteelBlocks; i++) {
                const sr = randomInt(2, ROWS - 5);
                const sc = randomInt(2, COLS - 3);
                if (m[sr][sc] === EMPTY && m[sr][sc + 1] === EMPTY) {
                    m[sr][sc] = STEEL;
                    m[sr][sc + 1] = STEEL;
                    if (sr + 1 < ROWS - 2 && m[sr + 1][sc] === EMPTY && m[sr + 1][sc + 1] === EMPTY) {
                        m[sr + 1][sc] = STEEL;
                        m[sr + 1][sc + 1] = STEEL;
                    }
                }
            }

            // Water tiles
            for (let i = 0; i < numWaterTiles; i++) {
                const wr = randomInt(2, ROWS - 4);
                const wc = randomInt(2, COLS - 3);
                if (m[wr][wc] === EMPTY && m[wr][wc + 1] === EMPTY) {
                    m[wr][wc] = WATER;
                    m[wr][wc + 1] = WATER;
                }
            }

            // Ensure spawn points are clear
            // Player spawn (bottom)
            const playerSpawnCol = Math.floor(COLS / 2);
            const playerSpawnRow = ROWS - 3;
            for (let r = playerSpawnRow - 1; r <= playerSpawnRow + 1 && r < ROWS; r++) {
                for (let c = playerSpawnCol - 1; c <= playerSpawnCol + 1 && c < COLS; c++) {
                    if (r >= 0 && c >= 0 && m[r][c] !== BASE) m[r][c] = EMPTY;
                }
            }

            // Enemy spawn area (top)
            for (let r = 1; r <= 3; r++) {
                for (let c = COLS / 2 - 2; c <= COLS / 2 + 2; c++) {
                    if (c >= 0 && c < COLS && m[r][c] !== STEEL) m[r][c] = EMPTY;
                }
            }

            return m;
        }

        function canPlace(m, r, c, w, h) {
            for (let dr = 0; dr < h; dr++) {
                for (let dc = 0; dc < w; dc++) {
                    const nr = r + dr;
                    const nc = c + dc;
                    if (nr < 1 || nr >= ROWS - 1 || nc < 1 || nc >= COLS - 1) return false;
                    if (m[nr][nc] !== EMPTY) return false;
                }
            }
            return true;
        }

        function fillRect(m, r, c, w, h, type) {
            for (let dr = 0; dr < h; dr++) {
                for (let dc = 0; dc < w; dc++) {
                    m[r + dr][c + dc] = type;
                }
            }
        }

        // ====================== Tank Class ======================

        class Tank {
            constructor(x, y, dir, color, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.dir = dir;
                this.color = color;
                this.isPlayer = isPlayer;
                this.speed = isPlayer ? PLAYER_SPEED : ENEMY_SPEED;
                this.size = TILE_SIZE - 4;
                this.alive = true;
                this.shootCooldown = 0;
                this.shootDelay = isPlayer ? 400 : 800;
                this.moveTimer = 0;
                this.moveDuration = randomInt(60, 180);
                this.hp = 1;

                // Track position precisely for collision
                this.px = x;
                this.py = y;
            }

            getBounds() {
                return {
                    left: this.x + 2,
                    top: this.y + 2,
                    right: this.x + this.size - 2,
                    bottom: this.y + this.size - 2,
                };
            }

            move(dir, map) {
                let dx = 0, dy = 0;
                if (dir === UP) dy = -this.speed;
                if (dir === DOWN) dy = this.speed;
                if (dir === LEFT) dx = -this.speed;
                if (dir === RIGHT) dx = this.speed;

                // Try X movement
                if (dx !== 0) {
                    const newX = this.x + dx;
                    if (!this.collidesWithMap(newX, this.y, map) &&
                        !this.collidesWithTanks(newX, this.y)) {
                        this.x = newX;
                    } else {
                        // Snap to grid
                        if (dx > 0) this.x = Math.min(this.x + dx, this.findMapRight(this.x, this.y, map));
                        else this.x = Math.max(this.x + dx, this.findMapLeft(this.x, this.y, map));
                    }
                }

                // Try Y movement
                if (dy !== 0) {
                    const newY = this.y + dy;
                    if (!this.collidesWithMap(this.x, newY, map) &&
                        !this.collidesWithTanks(this.x, newY)) {
                        this.y = newY;
                    } else {
                        if (dy > 0) this.y = Math.min(this.y + dy, this.findMapBottom(this.x, this.y, map));
                        else this.y = Math.max(this.y + dy, this.findMapTop(this.x, this.y, map));
                    }
                }
            }

            collidesWithMap(x, y, map) {
                const b = this.getBoundsAt(x, y);
                const leftCol = Math.floor(b.left / TILE_SIZE);
                const rightCol = Math.floor(b.right / TILE_SIZE);
                const topRow = Math.floor(b.top / TILE_SIZE);
                const bottomRow = Math.floor(b.bottom / TILE_SIZE);

                for (let row = topRow; row <= bottomRow; row++) {
                    for (let col = leftCol; col <= rightCol; col++) {
                        if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return true;
                        const tile = map[row][col];
                        if (tile === BRICK || tile === STEEL || tile === BASE) return true;
                        if (tile === WATER && this.isPlayer) return true;
                    }
                }
                return false;
            }

            collidesWithTanks(x, y) {
                const myBounds = this.getBoundsAt(x, y);
                const allTanks = this.isPlayer ? enemies : [player, ...enemies.filter(e => e !== this && e.alive)];

                if (!this.isPlayer) {
                    allTanks.push(player);
                }

                for (const tank of allTanks) {
                    if (!tank || !tank.alive || tank === this) continue;
                    const tb = tank.getBounds();
                    if (rectsOverlap(myBounds, tb)) return true;
                }
                return false;
            }

            getBoundsAt(x, y) {
                return {
                    left: x + 2,
                    top: y + 2,
                    right: x + this.size - 2,
                    bottom: y + this.size - 2,
                };
            }

            findMapRight(x, y, map) {
                const b = this.getBoundsAt(x, y);
                const rightEdge = b.right;
                const col = Math.floor(rightEdge / TILE_SIZE);
                const snappedRight = col * TILE_SIZE - 2;
                // Don't go past the snapped edge if there's a wall
                const testBounds = this.getBoundsAt(snappedRight, y);
                const testCol = Math.floor(testBounds.right / TILE_SIZE);
                const topRow = Math.floor(b.top / TILE_SIZE);
                const bottomRow = Math.floor(b.bottom / TILE_SIZE);
                for (let row = topRow; row <= bottomRow; row++) {
                    if (row >= 0 && row < ROWS && testCol >= 0 && testCol < COLS) {
                        if (map[row][testCol] !== EMPTY && map[row][testCol] !== WATER) {
                            return snappedRight;
                        }
                    }
                }
                return snappedRight;
            }

            findMapLeft(x, y, map) {
                const b = this.getBoundsAt(x, y);
                const leftEdge = b.left;
                const col = Math.floor(leftEdge / TILE_SIZE);
                const snappedLeft = (col + 1) * TILE_SIZE - 2;
                const testBounds = this.getBoundsAt(snappedLeft, y);
                const testCol = Math.floor(testBounds.left / TILE_SIZE);
                const topRow = Math.floor(b.top / TILE_SIZE);
                const bottomRow = Math.floor(b.bottom / TILE_SIZE);
                for (let row = topRow; row <= bottomRow; row++) {
                    if (row >= 0 && row < ROWS && testCol >= 0 && testCol < COLS) {
                        if (map[row][testCol] !== EMPTY && map[row][testCol] !== WATER) {
                            return snappedLeft;
                        }
                    }
                }
                return snappedLeft;
            }

            findMapTop(x, y, map) {
                const b = this.getBoundsAt(x, y);
                const topEdge = b.top;
                const row = Math.floor(topEdge / TILE_SIZE);
                const snappedTop = (row + 1) * TILE_SIZE - 2;
                const testBounds = this.getBoundsAt(x, snappedTop);
                const testRow = Math.floor(testBounds.top / TILE_SIZE);
                const leftCol = Math.floor(b.left / TILE_SIZE);
                const rightCol = Math.floor(b.right / TILE_SIZE);
                for (let col = leftCol; col <= rightCol; col++) {
                    if (col >= 0 && col < COLS && testRow >= 0 && testRow < ROWS) {
                        if (map[testRow][col] !== EMPTY && map[testRow][col] !== WATER) {
                            return snappedTop;
                        }
                    }
                }
                return snappedTop;
            }

            findMapBottom(x, y, map) {
                const b = this.getBoundsAt(x, y);
                const bottomEdge = b.bottom;
                const row = Math.floor(bottomEdge / TILE_SIZE);
                const snappedBottom = row * TILE_SIZE - 2;
                const testBounds = this.getBoundsAt(x, snappedBottom);
                const testRow = Math.floor(testBounds.bottom / TILE_SIZE);
                const leftCol = Math.floor(b.left / TILE_SIZE);
                const rightCol = Math.floor(b.right / TILE_SIZE);
                for (let col = leftCol; col <= rightCol; col++) {
                    if (col >= 0 && col < COLS && testRow >= 0 && testRow < ROWS) {
                        if (map[testRow][col] !== EMPTY && map[testRow][col] !== WATER) {
                            return snappedBottom;
                        }
                    }
                }
                return snappedBottom;
            }

            shoot() {
                if (this.shootCooldown > 0) return null;
                this.shootCooldown = this.shootDelay;

                let bx = this.x + this.size / 2 - 2;
                let by = this.y + this.size / 2 - 2;

                if (this.dir === UP) { bx = this.x + this.size / 2 - 2; by = this.y - 4; }
                if (this.dir === DOWN) { bx = this.x + this.size / 2 - 2; by = this.y + this.size; }
                if (this.dir === LEFT) { bx = this.x - 4; by = this.y + this.size / 2 - 2; }
                if (this.dir === RIGHT) { bx = this.x + this.size; by = this.y + this.size / 2 - 2; }

                return new Bullet(bx, by, this.dir, this.isPlayer);
            }

            draw(ctx) {
                if (!this.alive) return;

                ctx.save();
                ctx.translate(this.x + this.size / 2, this.y + this.size / 2);

                // Rotation
                const angles = [-Math.PI / 2, 0, Math.PI / 2, Math.PI]; // up, right, down, left
                ctx.rotate(angles[this.dir]);

                const half = this.size / 2;

                // Tank body
                ctx.fillStyle = this.color;
                ctx.fillRect(-half + 2, -half + 4, this.size - 4, this.size - 8);

                // Tracks
                ctx.fillStyle = this.isPlayer ? '#2d8a6e' : '#555';
                ctx.fillRect(-half, -half, 6, this.size);  // left track
                ctx.fillRect(half - 6, -half, 6, this.size); // right track

                // Track details
                ctx.fillStyle = '#222';
                for (let i = -half + 3; i < half; i += 6) {
                    ctx.fillRect(3, i, 2, 3);
                    ctx.fillRect(-5, i, 2, 3);
                }

                // Turret
                ctx.fillStyle = this.isPlayer ? '#3ddc97' : '#e94560';
                ctx.fillRect(-3, -half + 10, 6, 10);

                // Barrel
                ctx.fillStyle = this.isPlayer ? '#2d8a6e' : '#b8304f';
                ctx.fillRect(-2, -half, 4, half + 2);

                // Center dot
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(0, 0, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                // Shield glow for player
                if (this.isPlayer && this.invincible > 0) {
                    ctx.strokeStyle = 'rgba(255, 255, 100, 0.7)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x + this.size / 2, this.y + this.size / 2, this.size / 2 + 4, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        }

        // Player spawn invincibility
        Tank.prototype.invincible = 0;

        // ====================== Bullet Class ======================

        class Bullet {
            constructor(x, y, dir, isPlayerBullet) {
                this.x = x;
                this.y = y;
                this.dir = dir;
                this.isPlayerBullet = isPlayerBullet;
                this.speed = BULLET_SPEED;
                this.alive = true;
                this.size = 4;
            }

            update(map) {
                let dx = 0, dy = 0;
                if (this.dir === UP) dy = -this.speed;
                if (this.dir === DOWN) dy = this.speed;
                if (this.dir === LEFT) dx = -this.speed;
                if (this.dir === RIGHT) dx = this.speed;

                this.x += dx;
                this.y += dy;

                // Check map collision
                const col = Math.floor((this.x + this.size / 2) / TILE_SIZE);
                const row = Math.floor((this.y + this.size / 2) / TILE_SIZE);

                if (row < 0 || row >= ROWS || col < 0 || col >= COLS) {
                    this.alive = false;
                    return;
                }

                const tile = map[row][col];
                if (tile === BRICK) {
                    map[row][col] = EMPTY;
                    this.alive = false;
                    spawnParticles(col * TILE_SIZE + TILE_SIZE / 2, row * TILE_SIZE + TILE_SIZE / 2, COLORS[BRICK], 8);
                    return;
                }
                if (tile === STEEL) {
                    this.alive = false;
                    spawnParticles(this.x, this.y, '#fff', 5);
                    return;
                }
                if (tile === BASE) {
                    map[row][col] = EMPTY;
                    this.alive = false;
                    baseAlive = false;
                    spawnParticles(col * TILE_SIZE + TILE_SIZE / 2, row * TILE_SIZE + TILE_SIZE / 2, COLORS[BASE], 20);
                    return;
                }

                // Check tank collision
                if (this.isPlayerBullet) {
                    for (const enemy of enemies) {
                        if (!enemy.alive) continue;
                        if (this.hitTank(enemy)) {
                            this.alive = false;
                            enemy.alive = false;
                            kills++;
                            score += 100;
                            spawnExplosion(enemy.x + enemy.size / 2, enemy.y + enemy.size / 2, enemy.color);
                            updateUI();
                            return;
                        }
                    }
                } else {
                    if (player.alive && this.hitTank(player)) {
                        this.alive = false;
                        if (player.invincible <= 0) {
                            playerHit();
                        }
                        return;
                    }
                }
            }

            hitTank(tank) {
                const b = tank.getBounds();
                return this.x + this.size > b.left &&
                       this.x < b.right &&
                       this.y + this.size > b.top &&
                       this.y < b.bottom;
            }

            draw(ctx) {
                if (!this.alive) return;

                ctx.fillStyle = this.isPlayerBullet ? '#ffe66d' : '#ff6b6b';
                ctx.shadowColor = this.isPlayerBullet ? '#ffe66d' : '#ff6b6b';
                ctx.shadowBlur = 6;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.shadowBlur = 0;

                // Trail
                ctx.fillStyle = this.isPlayerBullet ? 'rgba(255,230,109,0.4)' : 'rgba(255,107,107,0.4)';
                let tx = this.x, ty = this.y;
                if (this.dir === UP) ty += this.size;
                if (this.dir === DOWN) ty -= 4;
                if (this.dir === LEFT) tx += this.size;
                if (this.dir === RIGHT) tx -= 4;
                ctx.fillRect(tx, ty, this.size * 0.8, this.size * 0.8);
            }
        }

        // ====================== Particles ======================

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y, color,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 1,
                    decay: 0.02 + Math.random() * 0.04,
                    size: 1 + Math.random() * 3,
                });
            }
        }

        function spawnExplosion(x, y, color) {
            for (let i = 0; i < 25; i++) {
                particles.push({
                    x, y, color,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1,
                    decay: 0.015 + Math.random() * 0.03,
                    size: 2 + Math.random() * 5,
                });
            }
        }

        function updateParticles() {
            for (const p of particles) {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
            }
            particles = particles.filter(p => p.life > 0);
        }

        function drawParticles(ctx) {
            for (const p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
        }

        // ====================== Helpers ======================

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function rectsOverlap(a, b) {
            return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
        }

        function playerHit() {
            lives--;
            updateUI();
            spawnExplosion(player.x + player.size / 2, player.y + player.size / 2, player.color);

            if (lives <= 0) {
                player.alive = false;
                endGame(false);
            } else {
                // Respawn player
                player.x = (Math.floor(COLS / 2)) * TILE_SIZE + 2;
                player.y = (ROWS - 3) * TILE_SIZE + 2;
                player.dir = UP;
                player.invincible = 120; // 2 seconds of invincibility
                player.shootCooldown = 0;
            }
        }

        function updateUI() {
            scoreEl.textContent = score;
            levelEl.textContent = level;
            killsEl.textContent = kills;

            // Update lives display
            let hearts = '';
            for (let i = 0; i < lives; i++) {
                hearts += '<span class="tank-icon"></span>';
            }
            livesEl.innerHTML = '生命: ' + hearts;
        }

        function endGame(won) {
            gameRunning = false;
            gameOverOverlay.classList.add('show');
            if (won) {
                overlayTitle.textContent = '🏆 全部通关！';
                overlayMsg.textContent = '你是真正的坦克王牌！';
            } else {
                overlayTitle.textContent = '💥 游戏结束';
                overlayMsg.textContent = '你的基地被摧毁了...';
            }
            finalScore.textContent = score;
        }

        function showLevelUp() {
            gameRunning = false;
            levelUpNum.textContent = level;
            levelUpScore.textContent = score;
            levelUpOverlay.classList.add('show');
        }

        function resetGame() {
            map = generateMap(1);
            const spawnX = (Math.floor(COLS / 2)) * TILE_SIZE + 2;
            const spawnY = (ROWS - 3) * TILE_SIZE + 2;
            player = new Tank(spawnX, spawnY, UP, '#4ecca3', true);
            enemies = [];
            bullets = [];
            particles = [];
            score = 0;
            level = 1;
            kills = 0;
            lives = MAX_LIVES;
            gameRunning = true;
            gamePaused = false;
            baseAlive = true;
            spawnTimer = 0;
            enemyShootTimer = 0;
            gameOverOverlay.classList.remove('show');
            levelUpOverlay.classList.remove('show');
            updateUI();
            spawnEnemies(4);
        }

        function nextLevel() {
            level++;
            map = generateMap(level);
            const spawnX = (Math.floor(COLS / 2)) * TILE_SIZE + 2;
            const spawnY = (ROWS - 3) * TILE_SIZE + 2;
            player = new Tank(spawnX, spawnY, UP, '#4ecca3', true);
            enemies = [];
            bullets = [];
            particles = [];
            gameRunning = true;
            gamePaused = false;
            baseAlive = true;
            spawnTimer = 0;
            enemyShootTimer = 0;
            levelUpOverlay.classList.remove('show');
            gameOverOverlay.classList.remove('show');
            updateUI();
            const numEnemies = Math.min(4 + level, MAX_ENEMIES);
            spawnEnemies(numEnemies);
        }

        function spawnEnemies(count) {
            const positions = [
                { x: 1 * TILE_SIZE + 2, y: 1 * TILE_SIZE + 2 },
                { x: (COLS / 2) * TILE_SIZE + 2, y: 1 * TILE_SIZE + 2 },
                { x: (COLS - 2) * TILE_SIZE + 2, y: 1 * TILE_SIZE + 2 },
                { x: 2 * TILE_SIZE + 2, y: 2 * TILE_SIZE + 2 },
                { x: (COLS - 3) * TILE_SIZE + 2, y: 2 * TILE_SIZE + 2 },
                { x: (COLS / 2 - 1) * TILE_SIZE + 2, y: 1 * TILE_SIZE + 2 },
            ];

            const enemyColors = ['#e94560', '#ff6b6b', '#ff8e53', '#ffa647', '#c44569', '#cf6a87'];

            for (let i = 0; i < count && enemies.length < MAX_ENEMIES; i++) {
                const pos = positions[enemies.length % positions.length];
                const enemy = new Tank(pos.x, pos.y, DOWN, enemyColors[enemies.length % enemyColors.length], false);
                enemy.speed = ENEMY_SPEED + level * 0.3;
                enemy.shootDelay = Math.max(400, ENEMY_SHOOT_INTERVAL - level * 150);
                enemies.push(enemy);
            }
        }

        // ====================== AI ======================

        function updateEnemyAI(enemy) {
            if (!enemy.alive) return;

            enemy.shootCooldown = Math.max(0, enemy.shootCooldown - 16);

            // Change direction periodically or when blocked
            enemy.moveTimer--;
            if (enemy.moveTimer <= 0) {
                enemy.moveTimer = randomInt(40, 120);
                enemy.dir = randomInt(0, 3);
            }

            // Occasionally aim toward player
            if (Math.random() < 0.01 && player.alive) {
                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;
                if (Math.abs(dx) > Math.abs(dy)) {
                    enemy.dir = dx > 0 ? RIGHT : LEFT;
                } else {
                    enemy.dir = dy > 0 ? DOWN : UP;
                }
                enemy.moveTimer = randomInt(30, 90);
            }

            // Store previous position
            const prevX = enemy.x;
            const prevY = enemy.y;

            // Move
            enemy.move(enemy.dir, map);

            // If stuck, change direction
            if (Math.abs(enemy.x - prevX) < 0.1 && Math.abs(enemy.y - prevY) < 0.1) {
                enemy.dir = randomInt(0, 3);
                enemy.moveTimer = randomInt(20, 60);
            }

            // Shoot
            if (enemy.shootCooldown <= 0 && Math.random() < 0.015) {
                const bullet = enemy.shoot();
                if (bullet) bullets.push(bullet);
            }

            // Collision with player
            if (player.alive && player.invincible <= 0) {
                const eb = enemy.getBounds();
                const pb = player.getBounds();
                if (rectsOverlap(eb, pb)) {
                    playerHit();
                }
            }
        }

        // ====================== Render ======================

        function drawMap() {
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    const tile = map[row][col];
                    if (tile === EMPTY) continue;

                    const x = col * TILE_SIZE;
                    const y = row * TILE_SIZE;

                    if (tile === BRICK) {
                        ctx.fillStyle = '#c97b3b';
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#a05a2c';
                        ctx.fillRect(x + 1, y + 1, TILE_SIZE / 2 - 1, TILE_SIZE / 2 - 1);
                        ctx.fillRect(x + TILE_SIZE / 2, y + TILE_SIZE / 2, TILE_SIZE / 2 - 1, TILE_SIZE / 2 - 1);
                        ctx.strokeStyle = '#6b3a1f';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(x + 0.5, y + 0.5, TILE_SIZE - 1, TILE_SIZE - 1);
                    } else if (tile === STEEL) {
                        ctx.fillStyle = '#999';
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#bbb';
                        ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                        ctx.fillStyle = '#777';
                        ctx.fillRect(x + 4, y + 4, TILE_SIZE - 8, TILE_SIZE - 8);
                        // Shine
                        ctx.fillStyle = 'rgba(255,255,255,0.3)';
                        ctx.fillRect(x + 2, y + 2, TILE_SIZE - 8, 3);
                    } else if (tile === WATER) {
                        ctx.fillStyle = '#1155aa';
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        // Wave animation
                        const waveOffset = Math.sin(Date.now() / 300 + col + row) * 2;
                        ctx.fillStyle = '#3399ee';
                        ctx.fillRect(x, y + 8 + waveOffset, TILE_SIZE, 4);
                        ctx.fillStyle = 'rgba(255,255,255,0.2)';
                        ctx.fillRect(x, y + 2, TILE_SIZE, 2);
                    } else if (tile === BASE) {
                        // Eagle / base
                        ctx.fillStyle = '#ffdd00';
                        ctx.fillRect(x + 4, y + 4, TILE_SIZE - 8, TILE_SIZE - 8);
                        ctx.fillStyle = '#222';
                        ctx.fillRect(x + 8, y + 6, TILE_SIZE - 16, TILE_SIZE - 12);
                        // Wings
                        ctx.fillStyle = '#ffdd00';
                        ctx.beginPath();
                        ctx.moveTo(x + 4, y + 10);
                        ctx.lineTo(x + 1, y + TILE_SIZE - 2);
                        ctx.lineTo(x + 4, y + TILE_SIZE - 4);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(x + TILE_SIZE - 4, y + 10);
                        ctx.lineTo(x + TILE_SIZE - 1, y + TILE_SIZE - 2);
                        ctx.lineTo(x + TILE_SIZE - 4, y + TILE_SIZE - 4);
                        ctx.fill();
                    }
                }
            }
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 0.5;
            for (let x = 0; x <= COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(x * TILE_SIZE, 0);
                ctx.lineTo(x * TILE_SIZE, ROWS * TILE_SIZE);
                ctx.stroke();
            }
            for (let y = 0; y <= ROWS; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * TILE_SIZE);
                ctx.lineTo(COLS * TILE_SIZE, y * TILE_SIZE);
                ctx.stroke();
            }
        }

        function render() {
            // Clear
            ctx.fillStyle = '#151515';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawGrid();
            drawMap();

            // Draw tanks
            for (const enemy of enemies) {
                if (enemy.alive) enemy.draw(ctx);
            }
            if (player.alive) player.draw(ctx);

            // Draw bullets
            for (const bullet of bullets) {
                bullet.draw(ctx);
            }

            // Draw particles
            drawParticles(ctx);

            // Pause overlay
            if (gamePaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 48px "Courier New", "SimHei", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('⏸ 暂停中', canvas.width / 2, canvas.height / 2);
                ctx.font = '18px "Courier New", "SimHei", monospace';
                ctx.fillText('按 P 继续', canvas.width / 2, canvas.height / 2 + 40);
                ctx.textAlign = 'start';
            }
        }

        // ====================== Game Loop ======================

        function update(dt) {
            if (!gameRunning || gamePaused) return;

            const dtSec = dt / 1000;

            // Update player
            if (player.alive) {
                player.shootCooldown = Math.max(0, player.shootCooldown - dt);
                if (player.invincible > 0) player.invincible--;

                let moved = false;
                if (keys['ArrowUp'] || keys['KeyW']) { player.dir = UP; player.move(UP, map); moved = true; }
                if (keys['ArrowDown'] || keys['KeyS']) { player.dir = DOWN; player.move(DOWN, map); moved = true; }
                if (keys['ArrowLeft'] || keys['KeyA']) { player.dir = LEFT; player.move(LEFT, map); moved = true; }
                if (keys['ArrowRight'] || keys['KeyD']) { player.dir = RIGHT; player.move(RIGHT, map); moved = true; }

                if (keys['Space']) {
                    const bullet = player.shoot();
                    if (bullet) bullets.push(bullet);
                }
            }

            // Update enemies
            for (const enemy of enemies) {
                updateEnemyAI(enemy);
            }

            // Clean dead enemies
            enemies = enemies.filter(e => e.alive);

            // Update bullets
            for (const bullet of bullets) {
                if (bullet.alive) bullet.update(map);
            }
            bullets = bullets.filter(b => b.alive);

            // Update particles
            updateParticles();

            // Spawn timer
            spawnTimer += dt;
            if (spawnTimer >= ENEMY_SPAWN_INTERVAL && enemies.length < MAX_ENEMIES) {
                spawnTimer = 0;
                spawnEnemies(1);
            }

            // Check base
            if (!baseAlive) {
                endGame(false);
                return;
            }

            // Check win condition
            if (enemies.length === 0 && kills >= 4 + level) {
                if (level >= 10) {
                    endGame(true);
                } else {
                    showLevelUp();
                }
                return;
            }

            updateUI();
        }

        // ====================== Event Handlers ======================

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;

            if (e.code === 'KeyP') {
                if (!gameRunning) return;
                gamePaused = !gamePaused;
            }

            if (e.code === 'KeyR') {
                resetGame();
            }

            // Prevent scrolling
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        document.getElementById('restartBtn').addEventListener('click', resetGame);
        document.getElementById('nextLevelBtn').addEventListener('click', nextLevel);

        // ====================== Main Loop ======================

        let lastTime = performance.now();

        function gameLoop(timestamp) {
            const dt = Math.min(timestamp - lastTime, 50); // Cap at 50ms to avoid big jumps
            lastTime = timestamp;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        // ====================== Init ======================

        map = generateMap(1);
        const spawnX = (Math.floor(COLS / 2)) * TILE_SIZE + 2;
        const spawnY = (ROWS - 3) * TILE_SIZE + 2;
        player = new Tank(spawnX, spawnY, UP, '#4ecca3', true);
        updateUI();
        spawnEnemies(4);
        requestAnimationFrame(gameLoop);

        console.log('🎮 坦克大战准备就绪！');
        console.log('操作: 方向键移动 | 空格射击 | P暂停 | R重新开始');
    })();
    </script>
